plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Jinahya Point Application for Spring Boot'

java {
    toolchain {
//        languageVersion = JavaLanguageVersion.of(25)
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    jinahyaPointPersistenceVersion = '0.0.1-SNAPSHOT'
}

dependencies {
    implementation("io.github.jinahya:jinahya-point-persistence-mapped:$jinahyaPointPersistenceVersion")
    testImplementation("io.github.jinahya:jinahya-point-persistence-mapped-test:$jinahyaPointPersistenceVersion")

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
//    testCompileOnly 'org.projectlombok:lombok'
//    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test') {
    useJUnitPlatform()
}
